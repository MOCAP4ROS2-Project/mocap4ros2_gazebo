# A mocap room in Gazebo with a box moving in circles.
launch:
  - arg: {name: world, default: "$(find-pkg-share mocap4r2_gz_plugin)/worlds/mocap_room.sdf"}
  - include:
      file: "$(find-pkg-share ros_gz_sim)/launch/gz_sim.launch.py"
      arg:
        - {name: gz_args, value: "-r $(var world)"}
  - node:
      pkg: ros_gz_bridge
      exec: parameter_bridge
      args: /clock@rosgraph_msgs/msg/Clock[gz.msgs.Clock
      output: screen
